# fly.toml app configuration file generated for wkil-main-service on 2026-06-03T22:08:30Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'wkil-main-service'
primary_region = 'cdg'

[build]

[deploy]
  release_command = 'sh -c "DATABASE_URL=$DIRECT_URL npx prisma migrate deploy"'

[env]
  USE_AGENT_SERVICE = "true"
  # Private 6PN: the agent container runs an IPv6 forwarder ([::]:8123 -> 127.0.0.1:8123).
  LANGGRAPH_API_URL = "http://wkil-agent-service.internal:8123"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  # Always keep one machine running: this is the primary business API (webhooks
  # must never miss messages) and the agent service calls it over the private
  # network — internal .internal traffic does NOT wake a stopped machine.
  min_machines_running = 1
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
